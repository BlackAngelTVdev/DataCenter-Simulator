<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182238"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4da3e8"/>
      <stop offset="1" stop-color="#3378c0"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f4f80"/>
      <stop offset="1" stop-color="#173c63"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29669f"/>
      <stop offset="1" stop-color="#1e4c7a"/>
    </linearGradient>
  </defs>

  <rect width="1040" height="520" fill="url(#bg)"/>

  <!-- grille isométrique discrète -->
  <g stroke="#2a3d66" stroke-width="1" opacity="0.5">
    <line x1="60" y1="400" x2="520" y2="160"/>
    <line x1="160" y1="440" x2="620" y2="200"/>
    <line x1="260" y1="480" x2="720" y2="240"/>
    <line x1="360" y1="520" x2="820" y2="280"/>
    <line x1="460" y1="560" x2="920" y2="320"/>
    <line x1="1040" y1="400" x2="560" y2="160"/>
    <line x1="940" y1="440" x2="460" y2="200"/>
    <line x1="840" y1="480" x2="360" y2="240"/>
    <line x1="740" y1="520" x2="260" y2="280"/>
    <line x1="640" y1="560" x2="160" y2="320"/>
  </g>

  <!-- cubes isométriques (data centers) -->
  <g>
    <!-- cube central -->
    <polygon points="500,140 640,70 780,140 640,210" fill="url(#top)"/>
    <polygon points="500,140 640,210 640,350 500,280" fill="url(#left)"/>
    <polygon points="780,140 640,210 640,350 780,280" fill="url(#right)"/>
    <!-- cube gauche -->
    <polygon points="310,200 400,155 490,200 400,245" fill="url(#top)"/>
    <polygon points="310,200 400,245 400,355 310,310" fill="url(#left)"/>
    <polygon points="490,200 400,245 400,355 490,310" fill="url(#right)"/>
    <!-- cube droit -->
    <polygon points="690,300 790,250 890,300 790,350" fill="url(#top)"/>
    <polygon points="690,300 790,350 790,470 690,420" fill="url(#left)"/>
    <polygon points="890,300 790,350 790,470 890,420" fill="url(#right)"/>
    <!-- petit cube avant -->
    <polygon points="450,340 520,305 590,340 520,375" fill="url(#top)"/>
    <polygon points="450,340 520,375 520,465 450,430" fill="url(#left)"/>
    <polygon points="590,340 520,375 520,465 590,430" fill="url(#right)"/>
  </g>
</svg>
